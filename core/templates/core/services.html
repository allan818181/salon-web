{% load static %}
{% load i18n %}

<!DOCTYPE html>
<html lang="{{ request.LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Services" %} - Lumina Salon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .heading { font-family: 'Playfair Display', serif; }
        .service-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .service-card:hover {
            transform: translateY(-12px);
        }
    </style>
</head>
<body class="bg-zinc-950 text-white">

    {% include 'core/partials/navbar.html' %}

    <section class="pt-24 pb-20">
        <div class="max-w-7xl mx-auto px-6">
            <div class="text-center mb-16">
                <h1 class="text-6xl heading mb-4">{% trans "Our Premium Services" %}</h1>
                <p class="text-xl text-gray-400">{% trans "Luxury care with transparent pricing in TSh" %}</p>
            </div>

            <!-- Category Tabs -->
            <div class="flex flex-wrap justify-center gap-4 mb-12">
                <button onclick="filterCategory('all')" class="category-btn active px-8 py-4 rounded-3xl bg-[#C8A97E] text-black font-medium">{% trans "All" %}</button>
                <button onclick="filterCategory('hair')" class="category-btn px-8 py-4 rounded-3xl hover:bg-zinc-800">{% trans "Hair" %}</button>
                <button onclick="filterCategory('grooming')" class="category-btn px-8 py-4 rounded-3xl hover:bg-zinc-800">{% trans "Grooming" %}</button>
                <button onclick="filterCategory('spa')" class="category-btn px-8 py-4 rounded-3xl hover:bg-zinc-800">{% trans "Spa & Massage" %}</button>
                <button onclick="filterCategory('skin')" class="category-btn px-8 py-4 rounded-3xl hover:bg-zinc-800">{% trans "Skin Care" %}</button>
                <button onclick="filterCategory('nails')" class="category-btn px-8 py-4 rounded-3xl hover:bg-zinc-800">{% trans "Nails" %}</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="services-grid">
                <!-- Populated by JavaScript -->
            </div>
        </div>
    </section>

    {% include 'core/partials/footer.html' %}

    <script>
        const services = [
            {id:1, category:"hair", name:"Men's Haircut", sw:"Kukata Nywele kwa Wanaume", duration:"30 min", price:"25000", img:"https://images.unsplash.com/photo-1562322140-8baeececf3df"},
            {id:2, category:"hair", name:"Women's Haircut", sw:"Kukata Nywele kwa Wanawake", duration:"45 min", price:"40000", img:"https://images.unsplash.com/photo-1600585154340-be6161a56a9c"},
            {id:3, category:"hair", name:"Hair Styling", sw:"Kutengeneza Nywele", duration:"40 min", price:"35000", img:"https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f"},
            {id:4, category:"spa", name:"Massage Therapy", sw:"Tiba ya Masaji", duration:"60 min", price:"60000", img:"https://images.unsplash.com/photo-1576091160399-112ba8d5c8f6"},
            {id:5, category:"spa", name:"Head Massage", sw:"Masaji ya Kichwa", duration:"20 min", price:"15000", img:"https://images.unsplash.com/photo-1600335895229-0f5d8c8e5e6f"},
            {id:6, category:"skin", name:"Facial Treatment", sw:"Utunzaji wa Uso", duration:"45 min", price:"35000", img:"https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b"},
            {id:7, category:"grooming", name:"Beard Trim", sw:"Kupunguza Ndevu", duration:"20 min", price:"15000", img:"https://images.unsplash.com/photo-1621607512214-682c4f2c5c8f"},
            {id:8, category:"nails", name:"Manicure", sw:"Manicure", duration:"30 min", price:"20000", img:"https://images.unsplash.com/photo-1604654894610-df63bc536371"},
            {id:9, category:"nails", name:"Pedicure", sw:"Pedicure", duration:"40 min", price:"25000", img:"https://images.unsplash.com/photo-1604654894610-df63bc536371"},
        ];

        function renderServices(filtered) {
            const grid = document.getElementById('services-grid');
            grid.innerHTML = '';
            filtered.forEach(s => {
                const card = document.createElement('div');
                card.className = 'service-card bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800';
                card.innerHTML = `
                    <img src="${s.img}" class="w-full h-64 object-cover">
                    <div class="p-8">
                        <h3 class="text-2xl font-semibold mb-1">${s.name}</h3>
                        <p class="text-[#C8A97E] mb-6">${s.sw}</p>
                        <div class="flex justify-between">
                            <div>
                                <p class="text-gray-400 text-sm">{% trans "Duration" %}</p>
                                <p class="font-medium">${s.duration}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-gray-400 text-sm">{% trans "Price" %}</p>
                                <p class="text-3xl font-bold text-[#C8A97E]">${s.price} TSh</p>
                            </div>
                        </div>
                        <button onclick="bookService(${s.id})" 
                                class="mt-8 w-full py-4 bg-[#C8A97E] hover:bg-amber-700 text-black font-semibold rounded-2xl transition">
                            {% trans "Book Now" %}
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active', 'bg-[#C8A97E]', 'text-black'));
            if (cat === 'all') {
                document.querySelectorAll('.category-btn')[0].classList.add('active', 'bg-[#C8A97E]', 'text-black');
                renderServices(services);
            } else {
                renderServices(services.filter(s => s.category === cat));
            }
        }

        function bookService(id) {
            alert("Service selected! Booking wizard starts in next step.");
        }

        // Initial load
        window.onload = () => renderServices(services);
    </script>
</body>
</html>
